# Nginx 보안 설정
server {
    listen 80;
    server_name your-domain.com;
    
    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=download:10m rate=3r/m;
    
    # 허용된 엔드포인트만 프록시
    location ~ ^/(extract|download|files|delete|version|health) {
        limit_req zone=api burst=5 nodelay;
        
        # 의심스러운 User-Agent 차단
        if ($http_user_agent ~* (bot|crawler|spider|scanner|curl|wget)) {
            return 403;
        }
        
        # 허용된 메소드만
        limit_except GET POST {
            deny all;
        }
        
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # 다운로드 엔드포인트는 더 엄격한 제한
    location ~ ^/files/ {
        limit_req zone=download burst=3 nodelay;
        
        # 파일 확장자 제한
        location ~* \.(m4a|mp3|mp4|wav|flac)$ {
            proxy_pass http://127.0.0.1:8080;
        }
        
        # 허용되지 않은 파일 형식 차단
        return 403;
    }
    
    # 루트 및 기타 경로 차단
    location / {
        return 404;
    }
    
    # 로그 설정
    access_log /var/log/nginx/jupotify_access.log;
    error_log /var/log/nginx/jupotify_error.log;
}
